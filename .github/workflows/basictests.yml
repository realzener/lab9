name: Basic Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test 1 - Valid input
        run: |
          result=$(bash validate-data.sh "pearse meearthy" "U9AELEESAR")
          echo "Test 1 result: $result"
          [ "$result" = "PASS" ]

      - name: Test 2 - Invalid mobile number
        run: |
          result=$(bash validate-data.sh "pearse mecarthy" "OB311223344")
          echo "Test 2 result: $result"
          [ "$result" = "FAIL" ]

      - name: Test 3 - Invalid mobile number
        run: |
          result=$(bash validate-data.sh "pearse mecarthy" "08B31122334")
          echo "Test 3 result: $result"
          [ "$result" = "FAIL" ]
